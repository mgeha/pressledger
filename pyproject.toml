[project]
name = "pressledger"
version = "0.1.0"
description = "Accounting report for Canon PRISMAsync print systems"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Michael Hampicke"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "babel>=2.18.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.1",
]

[project.urls]
Homepage = "https://github.com/mgeha/pressledger"
Repository = "https://github.com/mgeha/pressledger"
Issues = "https://github.com/mgeha/pressledger/issues"

[project.scripts]
pressledger = "pressledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pressledger"]


# No [tool.babel] section: Babel would then extract from .py files only and miss
# every template string. The mapping file is passed explicitly in tools/i18n.sh.

[dependency-groups]
dev = [
    "httpx2>=2.12.0",  # Required by Starlette's TestClient.
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py311"

line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4", "DTZ", "PTH", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in default arguments is the correct pattern
    "BLE001",  # broad except Exception is intentional in sync and translation fallback
    "DTZ005",  # APScheduler next_run_time uses local naive datetime by design
    "DTZ007",  # printer timestamps are local naive datetimes without timezone info
]

[tool.ruff.lint.per-file-ignores]
# The example uses local dates to match the API's date filters.
"examples/*" = ["DTZ011"]
